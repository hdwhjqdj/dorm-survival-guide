<body>
<div class="app">

  <section id="s-cover" class="screen">

      <button class="btn btn-primary" id="startBtn">开始速测</button>
      <p class="cover-note">题目没有对错，按第一反应选。<br>不收集姓名、学校、宿舍号等个人信息。</p>

  <section id="s-quiz" class="screen" hidden>

        <button class="iconbtn" id="backBtn" aria-label="上一题" disabled>←</button>
        <div class="qmeta">
          <div class="qcount"><span>第 <b id="qNow">1</b> / 8 题</span><span id="qPct">0%</span></div>
          <div class="pbar"><i id="pFill"></i></div>
        </div>
      </div>
    </div>
    <div class="qbody">
      <div class="qno" id="qNo">Q1</div>
      <h2 class="qtext" id="qText">　</h2>
      <p class="hint">按第一反应选，不用想太久</p>
      <div class="opts" id="opts"></div>
      <div class="qfoot">可以点左上角返回上一题修改。</div>

<script>
/* ============================================================
   运营配置：
   fullUrl —— 完整版（18 题）的地址，默认指向同目录完整版页面
   ============================================================ */
var CONFIG = {
  fullUrl: "roommate-boundary-quiz.html"
};

/* 8 题：4 维各 1 题 + 4 题表达倾向 */
var QUESTIONS = [
  { dim:"space", axis:"b", text:"你不在时，室友坐在你床上和别人视频。", options:[
    { text:"回来后直接说“床我不太希望别人坐”", score:2 },
    { text:"换床单，但不说", score:1 },
    { text:"觉得没什么，随便坐", score:0 }
  ]},
  { dim:"time", axis:"b", text:"室友凌晨 1 点外放短视频。", options:[
    { text:"当场提醒，约定 11 点后戴耳机", score:2 },
    { text:"翻身、叹气、发朋友圈，但不开口", score:1 },
    { text:"戴上耳塞继续睡", score:0 }
  ]},
  { dim:"task", axis:"b", text:"室友临时带朋友回宿舍过夜，没提前说。", options:[
    { text:"事前约定“留宿提前一天说”，这次也讲清楚", score:2 },
    { text:"当晚不说，第二天冷脸", score:1 },
    { text:"自己出去住或挤一挤", score:0 }
  ]},
  { dim:"emotion", axis:"b", text:"室友拿你的成绩或外貌开玩笑，你并不舒服。", options:[
    { text:"当场说“这个玩笑我不喜欢”", score:2 },
    { text:"笑一下，回座位", score:1 },
    { text:"跟着一起自嘲", score:0 }
  ]},
  { dim:null, axis:"e", text:"当你对室友不满时，通常会：", options:[
    { text:"当天找机会直接说", score:2 },
    { text:"先在微信上打字，反复修改后发", score:1 },
    { text:"不说，等他自己发现", score:0 }
  ]},
  { dim:null, axis:"e", text:"室友提出你不方便的请求（比如帮他带饭）：", options:[
    { text:"直接说“不顺路，这次不行”", score:2 },
    { text:"勉强答应，事后后悔", score:1 },
    { text:"答应，并绕路去买", score:0 }
  ]},
  { dim:null, axis:"e", text:"发生摩擦后，你通常会：", options:[
    { text:"主动把话说开", score:2 },
    { text:"等对方先开口", score:1 },
    { text:"冷处理，慢慢疏远", score:0 }
  ]},
  { dim:null, axis:"e", text:"“室友应该读懂我的不满，而不是我说出来。”", options:[
    { text:"不同意，我需要明确表达", score:2 },
    { text:"一半一半", score:1 },
    { text:"同意，说出来太伤感情", score:0 }
  ]}
];

var TYPES = {
  sh: {
    key:"sh", name:"先说好型", tag:"丑话说前面",
    quote:"“丑话说在前面，是为了后面不用翻脸。”",
    need:"你要的是规则清晰、可预期、说到做到。"
  },
  yh: {
    key:"yh", name:"隐形记账型", tag:"不说但记着",
    quote:"“我的沉默不是同意，是还没想好怎么开口。”",
    need:"你要的是被尊重、被看见，不用自己开口也能被照顾到。"
  },
  bt: {
    key:"bt", name:"不分你我型", tag:"你的也该是我的",
    quote:"“我不是没分寸，我只是把你算得太近。”",
    need:"你要的是亲密、共享、被当成“自己人”。"
  },
  wd: {
    key:"wd", name:"我都行型", tag:"都可以，其实不行",
    quote:"“我说都可以，是怕给你添麻烦。”",
    need:"你要的是和谐、不被讨厌、不被当成麻烦。"
  }
};

var answers = new Array(8).fill(null);
var orders = [];
var current = 0;
var locked = false;
var els = {
  cover: document.getElementById("s-cover"),
  quiz: document.getElementById("s-quiz"),
  result: document.getElementById("s-result"),
  qNow: document.getElementById("qNow"),
  qPct: document.getElementById("qPct"),
  qFill: document.getElementById("pFill"),
  qNo: document.getElementById("qNo"),
  qText: document.getElementById("qText"),
  opts: document.getElementById("opts"),
  back: document.getElementById("backBtn"),
  loading: document.getElementById("loading"),
  resultBox: document.getElementById("result"),
  resDate: document.getElementById("resDate")
};

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function startQuiz(){
  answers = new Array(8).fill(null);
  current = 0;
  locked = false;
  orders = QUESTIONS.map(function(){ return shuffle([0,1,2]); });
  els.cover.hidden = true;
  els.result.hidden = true;
  els.quiz.hidden = false;
  renderQuestion();
}

function renderQuestion(){
  locked = false;
  var q = QUESTIONS[current];
  els.qNow.textContent = current + 1;
  var pct = Math.round(current / QUESTIONS.length * 100);
  els.qPct.textContent = pct + "%";
  els.qFill.style.width = pct + "%";
  els.qNo.textContent = "Q" + (current + 1);
  els.qText.textContent = q.text;
  els.back.disabled = current === 0;

  var html = "";
  orders[current].forEach(function(idx){
    var o = q.options[idx];
    var on = answers[current] === o.score ? " on" : "";
    html += '<button class="opt'+on+'" data-score="'+o.score+'"><span class="dot"></span><span>'+o.text+'</span></button>';
  });
  els.opts.innerHTML = html;
  window.scrollTo(0,0);
}

function choose(score){
  if(locked) return;
  locked = true;
  answers[current] = score;
  var nodes = els.opts.querySelectorAll(".opt");
  for(var i=0;i<nodes.length;i++){
    nodes[i].classList.toggle("on", Number(nodes[i].getAttribute("data-score")) === score);
  }
  var idx = current;
  setTimeout(function(){
    if(current !== idx) return;
    if(idx < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      finish();
    }
  }, 200);
}

els.opts.addEventListener("click", function(e){
  var btn = e.target.closest(".opt");
  if(!btn) return;
  choose(Number(btn.getAttribute("data-score")));
});

els.back.addEventListener("click", function(){
  if(current > 0){ current--; renderQuestion(); }
});

function calc(){
  var b = 0, e = 0;
  for(var i=0;i<4;i++) b += answers[i];
  for(var j=4;j<8;j++) e += answers[j];
  var boundary = Math.round(b / 8 * 100);
  var expression = Math.round(e / 8 * 100);
  var strong = boundary >= 50, high = expression >= 50;
  var key = strong ? (high ? "sh" : "yh") : (high ? "bt" : "wd");
  return { boundary: boundary, expression: expression, type: TYPES[key] };
}

function finish(){
  els.quiz.hidden = true;
  els.loading.hidden = false;
  setTimeout(function(){
    els.loading.hidden = true;
    renderResult();
    els.result.hidden = false;
    window.scrollTo(0,0);
  }, 520);
}

function renderResult(){
  var r = calc();
  var t = r.type;
  var d = new Date();
  els.resDate.textContent = d.getFullYear() + "." + ("0"+(d.getMonth()+1)).slice(-2) + "." + ("0"+d.getDate()).slice(-2);

  var cta = CONFIG.fullUrl
    ? '<a class="btn btn-primary" href="'+CONFIG.fullUrl+'">去测 18 题完整版</a>'
    : '<p class="note8">完整版即将上架，先截图保存这张类型卡。</p>';

  els.resultBox.innerHTML =
    '<div class="hero t-'+t.key+'">'+
      '<div class="you">你是</div>'+
      '<h1>'+t.name+'</h1>'+
      '<p class="quote">'+t.quote+'</p>'+
      '<p class="need"><b>你的核心需求：</b>'+t.need+'</p>'+
      '<div class="savehint">截图保存这张卡，就是你的速测结果。</div>'+
    '</div>'+

    '<div class="sec">'+
      '<h2>这只是速测</h2>'+
      '<p class="lead">8 题只做快速归类。完整版用 18 题计算，会多给你这些：</p>'+
      '<ul class="perks">'+
        '<li>空间 / 时间 / 事务 / 情绪 四维分数，看出你的雷区在哪一维</li>'+
        '<li>雷区对应的 2 个具体场景，确认“不是我矫情”</li>'+
        '<li>3 条可以直接发给室友的说明书</li>'+
        '<li>今天就能说出口的一句开场话术</li>'+
      '</ul>'+
      cta+
      '<p class="note8">速测与完整版用的是同一套模型，但题量不同，结果可能略有差别；以完整版为准。</p>'+
    '</div>'+

    '<div class="res-foot">'+
      '<p class="disclaimer">本测试为原创趣味自我探索工具，结果为沟通参考，不构成心理测评、心理诊断、心理咨询或医疗建议，也不对任何现实关系结果作出承诺。结果描述的是你当前更习惯的相处方式，不构成对你或他人的评价。请勿据此给室友贴标签。</p>'+
    '</div>';
}

document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("restartBtn").addEventListener("click", function(){
  els.result.hidden = true;
  startQuiz();
});
</script>
