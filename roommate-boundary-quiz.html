  { dim:null, axis:"e", text:"发生摩擦后，你通常会：", options:[
    { text:"主动把话说开", score:2 },
    { text:"等对方先开口", score:1 },
    { text:"冷处理，慢慢疏远", score:0 }
  ]},
  { dim:null, axis:"e", text:"“室友应该读懂我的不满，而不是我说出来。”", options:[
    { text:"不同意，我需要明确表达", score:2 },
    { text:"一半一半", score:1 },
    { text:"同意，说出来太伤感情", score:0 }
  ]},
  { dim:null, axis:"e", text:"宿舍群讨论公共事务（卫生、水电费）时，你会：", options:[
    { text:"直接提出自己的方案", score:2 },
    { text:"附和多数人", score:1 },
    { text:"不发言", score:0 }
  ]}
];

/* ---------------- 四型文案 ---------------- */
var TYPES = {

    ],

    say:"“有件事我想了两天，还是觉得应该说一下：垃圾桶满了我会有点难受，我们能不能定个轮值？”"
  },
  bt: {
    key:"bt", name:"不分你我型", tag:"你的也该是我的",

      "我不是没边界，是把“自己人”划得很大。",
      "你拒绝我不会生气，但请告诉我原因。",

    ],
    fit:"我都行型（都愿意共享）、先说好型（能一起划清共享清单）。",
    say:"“我比较自来熟，但我不想让你不舒服。哪些东西你希望各用各的，你直接告诉我。”"
  },
  wd: {
    key:"wd", name:"我都行型", tag:"都可以，其实不行",
    quote:"“我说都可以，是怕给你添麻烦。”",
    need:"和谐、不被讨厌、不被当成麻烦。",
    behavior:"答应带饭并绕路；被开玩笑跟着笑；不舒服也说“没事”；用退让换和平。",
    manual:[
      "我说“都行”的时候，请再问一次“真的吗”。",
      "我拒绝时需要多一点时间，不是针对你。",
      "别把我的退让当成默认，我也会累。"
    ],
    fit:"先说好型（替你做决定）、隐形记账型（互不打扰）。",
    say:"“这次我可能不太方便，但我怕说出来你会不高兴，所以想先跟你说清楚。”"
  }

/* ---------------- 维度文案 ---------------- */
var DIMS = {
  space: {
    label:"空间边界",
    low:"你介意的不是一瓶洗发水，而是「没被问过」这件事。",
    scenes:[
      "室友拆了你的快递，说“我以为是公共的”。",
      "你不在时，室友坐在你床上和别人视频。"
    ],
    high:"你的物品与私人空间分得很清，不容易被占用。"
  },
  time: {
    label:"时间边界",
    low:"你介意的不是那点声音，而是「我的作息要为别人让路」。",
    scenes:[
      "凌晨 1 点，短视频外放。",
      "每天 6 点，宿舍里吹头发。"
    ],
    high:"你对作息有明确要求，能守住自己的节奏。"
  },
  task: {
    label:"事务边界",
    low:"你介意的不是一袋垃圾，而是「说好的事只有我在执行」。",
    scenes:[
      "轮值表轮到他，垃圾堆了三天。",
      "充电宝借走一周，没有要还的意思。"
    ],
    high:"你对“说好的事”很认真，公平感是你的底线。"
  },
  emotion: {
    label:"情绪边界",
    low:"你介意的不是那句玩笑，而是「我的感受被当成不重要」。",
    scenes:[
      "拿你的成绩或外貌开玩笑，你只能跟着笑。",
      "每天一小时的同一件事吐槽，你听完自己消化。"
    ],
    high:"你能分清“帮忙”和“被当成情绪垃圾桶”。"
  }
};

var DIM_ORDER = ["space","time","task","emotion"];

/* ---------------- 状态 ---------------- */
var answers = new Array(18).fill(null);
var orders = [];
var current = 0;
var els = {
  cover: document.getElementById("s-cover"),
  quiz: document.getElementById("s-quiz"),
  result: document.getElementById("s-result"),
  qNow: document.getElementById("qNow"),
  qPct: document.getElementById("qPct"),
  qFill: document.getElementById("pFill"),
  qNo: document.getElementById("qNo"),
  qText: document.getElementById("qText"),
  opts: document.getElementById("opts"),
  back: document.getElementById("backBtn"),
  loading: document.getElementById("loading"),
  resultBox: document.getElementById("result"),
  resDate: document.getElementById("resDate"),
  toast: document.getElementById("toast")
};

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function initOrders(){
  orders = QUESTIONS.map(function(){ return shuffle([0,1,2]); });
}

function show(el){ el.hidden = false; }
function hide(el){ el.hidden = true; }

function startQuiz(){
  answers = new Array(18).fill(null);
  current = 0;
  initOrders();
  hide(els.cover);
  hide(els.result);
  show(els.quiz);
  window.scrollTo(0,0);
  renderQuestion();
}

function renderQuestion(){
  var q = QUESTIONS[current];
  els.qNow.textContent = current + 1;
  var pct = Math.round(current / QUESTIONS.length * 100);
  els.qPct.textContent = pct + "%";
  els.qFill.style.width = pct + "%";
  els.qNo.textContent = "Q" + ("0" + (current+1)).slice(-2);
  els.qText.textContent = q.text;
  els.back.disabled = current === 0;

  var html = "";
  orders[current].forEach(function(idx){
    var o = q.options[idx];
    var on = answers[current] === o.score ? " on" : "";
    html += '<button class="opt'+on+'" data-score="'+o.score+'"><span class="dot"></span><span>'+o.text+'</span></button>';
  });
  els.opts.innerHTML = html;
  window.scrollTo(0,0);
}

function choose(score){
  answers[current] = score;
  var nodes = els.opts.querySelectorAll(".opt");
  for(var i=0;i<nodes.length;i++){
    nodes[i].classList.toggle("on", Number(nodes[i].getAttribute("data-score")) === score);
  }
  setTimeout(function(){
    if(current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      finish();
    }
  }, 220);
}

els.opts.addEventListener("click", function(e){
  var btn = e.target.closest(".opt");
  if(!btn) return;
  choose(Number(btn.getAttribute("data-score")));
});

els.back.addEventListener("click", function(){
  if(current > 0){
    current--;
    renderQuestion();
  }
});

/* ---------------- 计分 ---------------- */
function calc(){
  var boundaryRaw = 0, exprRaw = 0;
  for(var i=0;i<12;i++) boundaryRaw += answers[i];
  for(var j=12;j<18;j++) exprRaw += answers[j];

  var dims = {};
  DIM_ORDER.forEach(function(d, di){
    var s = 0;
    for(var k=0;k<3;k++) s += answers[di*3 + k];
    dims[d] = Math.round(s / 6 * 100);
  });

  var boundary = Math.round(boundaryRaw / 24 * 100);
  var expression = Math.round(exprRaw / 12 * 100);
  var suffocate = Math.round((100 - expression) * 0.6 + (100 - boundary) * 0.4);

  var strong = boundary >= 50, high = expression >= 50;
  var typeKey = strong ? (high ? "sh" : "yh") : (high ? "bt" : "wd");

  var lowKey = DIM_ORDER.reduce(function(a,b){ return dims[b] < dims[a] ? b : a; });
  var highKey = DIM_ORDER.filter(function(d){ return d !== lowKey; })
    .reduce(function(a,b){ return dims[b] > dims[a] ? b : a; }, DIM_ORDER[0] === lowKey ? DIM_ORDER[1] : DIM_ORDER[0]);

  return {
    boundary: boundary, expression: expression, suffocate: suffocate,
    dims: dims, type: TYPES[typeKey], lowKey: lowKey, highKey: highKey
  };
}

function band(v){
  if(v < 25) return "还好，你不太憋";
  if(v < 50) return "偶尔忍一下";
  if(v < 75) return "忍得有点久";
  return "忍到内伤";
}

function finish(){
  hide(els.quiz);
  show(els.loading);
  setTimeout(function(){
    hide(els.loading);
    renderResult();
    show(els.result);
    window.scrollTo(0,0);
  }, 620);
}

/* ---------------- 结果渲染 ---------------- */
function renderResult(){
  var r = calc();
  var t = r.type;
  var low = DIMS[r.lowKey], high = DIMS[r.highKey];
  var d = new Date();
  els.resDate.textContent = d.getFullYear() + "." + ("0"+(d.getMonth()+1)).slice(-2) + "." + ("0"+d.getDate()).slice(-2);

  var barsHtml = DIM_ORDER.map(function(k){
    var v = r.dims[k];
    var cls = k === r.lowKey ? "low" : (k === r.highKey ? "high" : "");
    return '<div class="bar-row '+cls+'">'+
      '<span class="lb">'+DIMS[k].label.replace("边界","")+'</span>'+
      '<span class="track"><i class="fill" data-w="'+v+'"></i></span>'+
      '<span class="val">'+v+'</span></div>';
  }).join("");

  var manualHtml = t.manual.map(function(s){ return '<li>'+s+'</li>'; }).join("");
  var scenesHtml = low.scenes.map(function(s){ return '<li>'+s+'</li>'; }).join("");

  var upgradeHtml =
    '<div class="upsell">'+
      '<div class="up"><div class="n">完整报告<span>四维详解 + 雷区清单 + 5 句沟通话术</span></div><div class="p">'+CONFIG.reportPrice+' 元</div></div>'+
      '<div class="up"><div class="n">少吵架工具包<span>宿舍公约模板 + 20 句话术卡 + 自检表</span></div><div class="p">'+CONFIG.kitPrice+' 元</div></div>'+
    '</div>'+
    '<p class="lead" style="margin:12px 0 0; font-size:11.5px">'+(CONFIG.productUrl ? '在店铺内获取完整版，全部站内成交。' : '完整版与工具包即将上架，先截图保存这份说明书。')+'</p>';

  els.resultBox.innerHTML =
    '<div class="hero t-'+t.key+'">'+
      '<div class="you">你是</div>'+
      '<h1>'+t.name+'</h1>'+
      '<p class="quote">'+t.quote+'</p>'+
      '<p class="need"><b>核心需求：</b>'+t.need+'</p>'+
      '<p class="need" style="margin-bottom:14px"><b>典型行为：</b>'+t.behavior+'</p>'+
      '<div class="stats">'+
        '<div class="stat"><div class="v">'+r.boundary+'<small>/100</small></div><div class="k">边界强度</div></div>'+
        '<div class="stat"><div class="v">'+r.expression+'<small>/100</small></div><div class="k">表达倾向</div></div>'+
        '<div class="stat"><div class="v">'+r.suffocate+'<small>/100</small></div><div class="k">憋屈指数 · '+band(r.suffocate)+'</div></div>'+
      '</div>'+
      '<div class="savehint">截图这一页，就是你的类型卡。</div>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>你的四维边界</h2><span class="tag">0–100</span></div>'+
      '<p class="lead">分数越高，这一维的边界越清楚。最低的一维是你的雷区。</p>'+
      '<div class="bars">'+barsHtml+'</div>'+
      '<div class="chips"><span class="chip low">雷区 '+low.label+' '+r.dims[r.lowKey]+'</span><span class="chip high">底线 '+high.label+' '+r.dims[r.highKey]+'</span></div>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>你的雷区：'+low.label+'</h2><span class="tag">'+r.dims[r.lowKey]+' 分</span></div>'+
      '<p class="lead" style="color:#3a3630">'+low.low+'</p>'+
      '<ul class="scenes">'+scenesHtml+'</ul>'+
      '<p class="lead" style="margin:14px 0 0">你的底线在「'+high.label+'」：'+high.high+'</p>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>与我同住的说明书</h2><span class="tag">可直接发给室友</span></div>'+
      '<p class="lead">把这三句发给室友，比“你以后注意点”有用得多。</p>'+
      '<ol class="manual">'+manualHtml+'</ol>'+
      '<div class="say"><div class="k">今天可以先说这一句</div><p>'+t.say+'</p></div>'+
      '<button class="btn-copy" id="copyBtn">复制这份说明书</button>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>适合你的室友</h2><span class="tag">参考</span></div>'+
      '<p class="fit">'+t.fit+'</p>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>想要更完整的版本</h2><span class="tag">站内商品</span></div>'+
      upgradeHtml+
    '</div>'+

    '<div class="res-foot">'+
      '<p class="disclaimer">本测试为原创趣味自我探索工具，题目与结果为沟通参考，不构成心理测评、心理诊断、心理咨询或医疗建议，也不对任何现实关系结果作出承诺。结果描述的是你当前更习惯的相处方式，不构成对你或他人的评价。请勿据此给室友贴标签。</p>'+
    '</div>';

  // 四维条动画
  requestAnimationFrame(function(){
    setTimeout(function(){
      var fills = els.resultBox.querySelectorAll(".fill");
      for(var i=0;i<fills.length;i++){
        fills[i].style.width = fills[i].getAttribute("data-w") + "%";
      }
    }, 80);
  });

  document.getElementById("copyBtn").addEventListener("click", copyManual);
}

function copyManual(){
  var r = calc();
  var t = r.type;
  var text =
    "我的同住说明书\n"+
    "我是「"+t.name+"」——"+t.quote.replace(/[“”]/g,"")+"\n"+
    "边界强度 "+r.boundary+" / 表达倾向 "+r.expression+" / 憋屈指数 "+r.suffocate+"（"+band(r.suffocate)+"）\n\n"+
    "请这样和我同住：\n"+
    t.manual.map(function(s,i){ return (i+1)+". "+s; }).join("\n")+"\n\n"+
    "今天我想先说这一句：\n"+t.say+"\n\n"+
    "（来自「宿舍生存指南 · 室友相处风格测试」，原创趣味自我探索，非心理测评）";

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("已复制，可以直接发给室友"); }, function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly","");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
  document.body.removeChild(ta);
  toast(ok ? "已复制，可以直接发给室友" : "复制失败，请长按文字手动复制");
}

var toastTimer = null;
function toast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ els.toast.classList.remove("show"); }, 2200);
}

/* ---------------- 事件 ---------------- */
document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("restartBtn").addEventListener("click", function(){
  hide(els.result);
  startQuiz();
});
</script>
